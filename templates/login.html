{% extends 'base.html' %}
{% load static %}

{% block title %}Log in • Instagram{% endblock %}

{% block css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}

{% block body %}
    <main class="auth">

        <div class="card">
            <h1 class="logo auth-logo">Instagram</h1>

            {% if error %}
                <div class="alert" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="field{% if error %} has-error{% endif %}">
                    <label class="float-label">
                        <input type="text" name="username" placeholder=" "
                               value="{{ username|default:'' }}"
                               autocomplete="username" autocapitalize="off"
                               required {% if not username %}autofocus{% endif %}>
                        <span>Username</span>
                    </label>
                </div>

                <div class="field{% if error %} has-error{% endif %}">
                    <label class="float-label">
                        <input type="password" name="password" placeholder=" "
                               autocomplete="current-password"
                               required {% if username %}autofocus{% endif %}>
                        <span>Password</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block submit-btn">Log in</button>
            </form>
        </div>

        <div class="card switch">
            Don't have an account?
            <a href="{% url 'register' %}" class="link">Sign up</a>
        </div>

    </main>
{% endblock %}
