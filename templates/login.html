<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in • Instagram</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #262626;
            --muted: #737373;
            --border: #dbdbdb;
            --blue: #0095f6;
            --blue-hover: #1877f2;
            --error: #ed4956;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        button, input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .auth {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px 40px 28px;
            text-align: center;
        }

        .logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 54px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 32px;
        }

        .alert {
            background: #fdecee;
            border: 1px solid #f7c6cd;
            color: #c13545;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.4;
            text-align: left;
            margin-bottom: 14px;
        }

        /* Floating label input */
        .field {
            position: relative;
            display: block;
            margin-bottom: 6px;
            text-align: left;
        }

        .field input {
            width: 100%;
            height: 38px;
            padding: 9px 8px 7px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .field input:focus {
            border-color: #a8a8a8;
        }

        .field span {
            position: absolute;
            left: 9px;
            top: 11px;
            font-size: 12px;
            color: var(--muted);
            pointer-events: none;
            transition: top .1s ease-out, font-size .1s ease-out;
        }

        .field input:not(:placeholder-shown) {
            padding: 14px 8px 2px;
        }

        .field input:not(:placeholder-shown) + span {
            top: 4px;
            font-size: 10px;
        }

        .field.has-error input {
            border-color: var(--error);
        }

        .btn-primary {
            width: 100%;
            height: 34px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        .btn-primary:hover {
            background: var(--blue-hover);
        }

        .btn-primary:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 2px;
        }

        .switch {
            padding: 22px 20px;
            font-size: 14px;
        }

        .switch a {
            color: var(--blue);
            font-weight: 600;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            body {
                align-items: flex-start;
                background: var(--surface);
                padding-top: 48px;
            }

            .card {
                border: none;
                padding: 0 8px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="auth">

        <div class="card">
            <h1 class="logo">Instagram</h1>

            {% if error %}
                <div class="alert" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <label class="field{% if error %} has-error{% endif %}">
                    <input type="text" name="username" placeholder=" "
                           value="{{ username|default:'' }}"
                           autocomplete="username" autocapitalize="off"
                           required {% if not username %}autofocus{% endif %}>
                    <span>Username</span>
                </label>

                <label class="field{% if error %} has-error{% endif %}">
                    <input type="password" name="password" placeholder=" "
                           autocomplete="current-password"
                           required {% if username %}autofocus{% endif %}>
                    <span>Password</span>
                </label>

                <button type="submit" class="btn-primary">Log in</button>
            </form>
        </div>

        <div class="card switch">
            Don't have an account?
            <a href="{% url 'register' %}">Sign up</a>
        </div>

    </main>

</body>
</html>
