{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Instagram{% endblock %}</title>

    {# Sahifa chizilishidan oldin tanlangan mavzuni qo'yamiz, aks holda yorug' rang bir lahza "miltillab" qoladi #}
    <script>
        try {
            const theme = localStorage.getItem("theme");
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block css %}{% endblock %}
</head>

<body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
