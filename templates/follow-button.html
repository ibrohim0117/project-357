{% if target != request.user %}
    <form method="post" class="follow-form"
          action="{% if target.id in following_ids %}{% url 'unfollow' target.id %}{% else %}{% url 'follow' target.id %}{% endif %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}{% if reel %}#reel-{{ reel.id }}{% endif %}">
        {% if target.id in following_ids %}
            <button type="submit" class="btn btn-secondary follow-btn is-following">Following</button>
        {% else %}
            <button type="submit" class="btn btn-primary follow-btn">Follow</button>
        {% endif %}
    </form>
{% endif %}
